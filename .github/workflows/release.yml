name: Release

# Optional provider secrets (all omittable — without them CI ships Direct only):
#   PROVIDERS_REPO       owner/repo of an extra-provider repository
#   PROVIDERS_GIT_TOKEN  read token when PROVIDERS_REPO is private
#   BUNDLE_CONFIG_JSON   contents of bundle.config.json
#
# Optional Android signing secrets:
#   ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD is only needed when it differs from the keystore password.
#
# Optional macOS Developer ID signing and notarization secrets (all required):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY
#   KEYCHAIN_PASSWORD, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_B64
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag (for example v0.1.0)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  PROVIDERS_REPO: ${{ secrets.PROVIDERS_REPO }}
  BUNDLE_CONFIG: ${{ secrets.BUNDLE_CONFIG_JSON }}

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
          - name: macos-x64
            os: macos-15-intel
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
          - name: linux-x64
            os: ubuntu-22.04
            args: ''
            rust_targets: ''
          - name: windows-x64
            os: windows-latest
            args: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    env:
      MACOS_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.APPLE_API_ISSUER != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: yaya
      - name: Checkout extra providers
        if: env.PROVIDERS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PROVIDERS_REPO }}
          token: ${{ secrets.PROVIDERS_GIT_TOKEN || github.token }}
          path: providers-ext
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yaya
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yaya/package-lock.json
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Inject provider bundle
        if: env.BUNDLE_CONFIG != ''
        shell: bash
        working-directory: yaya
        run: |
          printf '%s' "$BUNDLE_CONFIG" > bundle.config.json
          node scripts/gen-bundle.mjs
      - name: Install frontend dependencies
        working-directory: yaya
        run: npm ci
      - name: Validate macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY_SECRET: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          values=(
            "$APPLE_CERTIFICATE"
            "$APPLE_CERTIFICATE_PASSWORD"
            "$APPLE_SIGNING_IDENTITY_SECRET"
            "$KEYCHAIN_PASSWORD"
            "$APPLE_API_ISSUER"
            "$APPLE_API_KEY"
            "$APPLE_API_KEY_B64"
          )
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if (( configured != 0 && configured != ${#values[@]} )); then
            echo "::error::macOS signing is only partially configured. Set all APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, KEYCHAIN_PASSWORD, APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_B64 secrets."
            exit 1
          fi
      - name: Import macOS signing certificate and notarization key
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          keychain_path="$RUNNER_TEMP/yaya-signing.keychain-db"
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A -out "$certificate_path"
          printf '%s' "$APPLE_API_KEY_B64" | openssl base64 -d -A -out "$api_key_path"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

          echo "APPLE_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"
      - name: Build desktop bundles
        working-directory: yaya
        env:
          # Keep ad-hoc signing as the no-secret fallback for macOS.
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY || '' }}
        run: npm run tauri build -- ${{ matrix.args }}
      - name: Verify signed and notarized macOS bundles
        if: runner.os == 'macOS' && env.MACOS_SIGNED == 'true'
        shell: bash
        working-directory: yaya
        run: |
          app_path="$(find target -type d -path '*/release/bundle/macos/*.app' -print -quit)"
          dmg_path="$(find target -type f -path '*/release/bundle/dmg/*.dmg' -print -quit)"
          test -n "$app_path"
          test -n "$dmg_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          xcrun stapler validate "$dmg_path"
      - uses: actions/upload-artifact@v4
        with:
          name: yaya-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            yaya/target/**/release/bundle/**/*.dmg
            yaya/target/**/release/bundle/**/*.AppImage
            yaya/target/**/release/bundle/**/*.deb
            yaya/target/**/release/bundle/**/*.rpm
            yaya/target/**/release/bundle/**/*.msi
            yaya/target/**/release/bundle/**/*.exe

  android:
    name: Android
    runs-on: ubuntu-22.04
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_SIGNED: ${{ secrets.ANDROID_KEYSTORE_B64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: yaya
      - name: Checkout extra providers
        if: env.PROVIDERS_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PROVIDERS_REPO }}
          token: ${{ secrets.PROVIDERS_GIT_TOKEN || github.token }}
          path: providers-ext
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: yaya
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: yaya/package-lock.json
      - name: Inject provider bundle
        if: env.BUNDLE_CONFIG != ''
        shell: bash
        working-directory: yaya
        run: |
          printf '%s' "$BUNDLE_CONFIG" > bundle.config.json
          node scripts/gen-bundle.mjs
      - name: Validate Android signing configuration
        shell: bash
        run: |
          values=(
            "$ANDROID_KEYSTORE_B64"
            "$ANDROID_KEYSTORE_PASSWORD"
            "$ANDROID_KEY_ALIAS"
          )
          configured=0
          for value in "${values[@]}"; do
            if [[ -n "$value" ]]; then
              configured=$((configured + 1))
            fi
          done
          if (( configured != 0 && configured != ${#values[@]} )); then
            echo "::error::Android signing is only partially configured. Set ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS together."
            exit 1
          fi
          if [[ -n "$ANDROID_KEY_PASSWORD" && "$ANDROID_SIGNED" != 'true' ]]; then
            echo "::error::ANDROID_KEY_PASSWORD cannot be used without the three required Android signing secrets."
            exit 1
          fi
      - name: Configure Android release signing
        if: env.ANDROID_SIGNED == 'true'
        shell: bash
        working-directory: yaya
        run: |
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          key_password="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          {
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyPassword=$key_password"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "storeFile=$RUNNER_TEMP/release.jks"
          } > src-tauri/gen/android/keystore.properties
      - name: Install frontend dependencies
        working-directory: yaya
        run: npm ci
      - name: Build Android APK
        working-directory: yaya
        run: npm run tauri android build -- --ci --apk
      - name: Verify Android APK signature
        if: env.ANDROID_SIGNED == 'true'
        shell: bash
        working-directory: yaya
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          found=false
          while IFS= read -r -d '' apk; do
            found=true
            "$apksigner" verify --verbose --print-certs "$apk"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -type f -path '*/release/*.apk' -print0)
          [[ "$found" == true ]]
      - uses: actions/upload-artifact@v4
        with:
          name: yaya-android
          if-no-files-found: error
          path: yaya/src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk

  release:
    name: Publish GitHub Release
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: yaya-*
          path: release-assets
      - name: Prepare uniquely named release assets
        shell: bash
        run: |
          mkdir -p upload
          for artifact_dir in release-assets/*; do
            prefix="$(basename "$artifact_dir")"
            while IFS= read -r -d '' asset; do
              cp "$asset" "upload/${prefix}-$(basename "$asset")"
            done < <(find "$artifact_dir" -type f -print0)
          done
          test -n "$(find upload -type f -print -quit)"
          (cd upload && sha256sum * > SHA256SUMS.txt)
      - name: Create or update GitHub Release
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            create_args=(release create "$RELEASE_TAG" --draft --generate-notes --title "YAYA $RELEASE_TAG" --target "$GITHUB_SHA")
            if [[ "$PRERELEASE" == 'true' ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}"
          fi
          gh release upload "$RELEASE_TAG" upload/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
