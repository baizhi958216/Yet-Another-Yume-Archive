# Android 15+ requires native libraries aligned for 16 KB memory pages
# (https://developer.android.com/16kb-page-size); NDK < r28 links 4 KB-aligned
# by default, so force the alignment for every Android target.
[target.aarch64-linux-android]
rustflags = [
  "-C",
  "link-arg=-Wl,-z,max-page-size=16384"
]

[target.armv7-linux-androideabi]
rustflags = [
  "-C",
  "link-arg=-Wl,-z,max-page-size=16384"
]

[target.i686-linux-android]
rustflags = [
  "-C",
  "link-arg=-Wl,-z,max-page-size=16384"
]

[target.x86_64-linux-android]
rustflags = [
  "-C",
  "link-arg=-Wl,-z,max-page-size=16384"
]
