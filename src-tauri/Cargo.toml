[package]
name = "yaya"
version.workspace = true
description = "YAYA - provider-driven universal downloader"
authors = ["YAYA contributors"]
edition.workspace = true
license.workspace = true

[lib]
# unique lib name to avoid clashing with the bin on Windows
name = "yaya_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
yaya-app-core = { path = "../crates/app-core" }
yaya-provider-api = { path = "../crates/provider-api" }
yaya-provider-host = { path = "../crates/provider-host" }
yaya-provider-bundle = { path = "../providers/bundle" }
yaya-task-runtime = { path = "../crates/task-runtime" }
